services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mantia
      POSTGRES_PASSWORD: dev_local_pwd
      POSTGRES_DB: mantia
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  n8n:
    image: n8nio/n8n
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes: ["n8ndata:/home/node/.n8n"]

volumes:
  pgdata:
  mongodata:
  n8ndata: